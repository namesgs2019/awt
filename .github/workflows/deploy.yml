name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # KST 09:00
    - cron: "0 9 * * *" # KST 18:00

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify Blogger build environment
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID || secrets.NEXT_PUBLIC_BLOGGER_BLOG_ID }}
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY || secrets.NEXT_PUBLIC_BLOGGER_API_KEY }}
        run: |
          if [ -z "$BLOGGER_BLOG_ID" ] || [ -z "$BLOGGER_API_KEY" ]; then
            echo "Blogger build environment is not configured."
            exit 1
          fi
          echo "Blogger build environment is configured."

      - name: Build static site
        env:
          NEXT_PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ENDPOINT }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID || secrets.NEXT_PUBLIC_BLOGGER_BLOG_ID }}
          BLOGGER_API_KEY: ${{ secrets.BLOGGER_API_KEY || secrets.NEXT_PUBLIC_BLOGGER_API_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
